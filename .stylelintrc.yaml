extends:
  - "stylelint-config-standard"
  - "stylelint-config-recommended-vue"
  - "stylelint-config-tailwindcss"
plugins:
  - "stylelint-order"
overrides:
  - files: ["**/*.vue"]
    customSyntax: "postcss-html"
rules:
  media-feature-range-notation: "prefix"
  at-rule-no-unknown:
    - true
    - ignoreAtRules: [apply, layer, responsive, screen, tailwind, variants]
  property-no-unknown:
    - true
    - ignoreProperties: ["/^--/"]
  custom-property-pattern: null
  selector-class-pattern: null
  order/properties-order:
    - groupName: "定位布局"
      properties: [position, top, right, bottom, left, z-index, display, float, clear]
    - groupName: "盒模型"
      properties: [box-sizing, width, height, max-width, max-height, min-width, min-height, margin, margin-top, margin-right, margin-bottom, margin-left, padding, padding-top, padding-right, padding-bottom, padding-left, border, border-top, border-right, border-bottom, border-left, border-width, border-style, border-color, border-radius]
    - groupName: "排版文字"
      properties: [font-family, font-size, font-weight, line-height, color, text-align, white-space, word-break]
    - groupName: "視覺表現"
      properties: [background, background-color, opacity, box-shadow, transform, transition]
    - groupName: "布局工具"
      properties: [flex, flex-direction, justify-content, align-items, grid, grid-template-columns, gap]
